name: Verify sources and publish Śāstrālaya
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  # The V1.2 regression passed Linux but failed on Windows 3.14.
  # Gate every production build on a real Windows Python 3.14 test run.
  windows-compat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check Windows source fidelity, complete synthetic build and restore
        run: python -m unittest discover -s tests -v
  build:
    needs: windows-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source model, generators and attack cases
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax before generating readers
        run: node --check src/assets/app.js
      - name: Download original source bytes; validate provenance
        run: python scripts/fetch.py --dest _sources
      - name: Build complete static reading library
        run: python scripts/build.py --source-dir _sources --out _site
      - name: Verify complete output, links, preserved text and absence of portfolio
        run: python scripts/check.py --site _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Jobs have separate workspaces. The probe script is not present unless
      # this deploy job independently checks out the source repository.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify real Pages URLs (not a rendered README)
        run: python scripts/live_smoke.py
